{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2 class="mb-4 text-center">Top Products</h2>
    <div class="row">
        {% for producto in productos %}
        <div class="col-md-4 mb-4 d-flex align-items-stretch">
            <div class="card">
                <img src="{{ producto.image }}" class="card-img-top" alt="{{ producto.title }}">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ producto.title }}</h5>
                    <p class="card-text">{{ producto.description | truncate(100) }}</p>
                    <p class="card-text"><strong>Price:</strong> ${{ producto.price }}</p>
                    <a href="/producto/{{ producto._id }}" class="btn btn-primary mt-auto">View Product</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
